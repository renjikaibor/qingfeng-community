name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create iOS platform
        run: flutter create --platforms=ios .

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (allow failure)
        run: flutter build ios --release --no-codesign
        continue-on-error: true

      - name: Find Runner.app
        id: find_app
        run: |
          echo '--- searching for Runner.app ---'
          APP_PATH=$(find build -name "Runner.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo 'NOT_FOUND'
            echo '--- listing build/ios ---'
            ls -laR build/ios/ 2>/dev/null | head -100 || true
            exit 1
          fi
          echo "Found: $APP_PATH"
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT

      - name: Package ipa
        run: |
          APP_PATH="${{ steps.find_app.outputs.app_path }}"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Runner.ipa Payload
          ls -la Runner.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runner-ios-unsigned
          path: Runner.ipa
